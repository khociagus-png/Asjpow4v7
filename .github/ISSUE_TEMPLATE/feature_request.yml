name: Feature Request
description: Suggest a new feature for ASJ Portal
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Describe the feature you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: e.g., Admin harus manually copy data kandidat ke Excel
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
      placeholder: e.g., Tombol "Export to Excel" di admin panel
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Admin Panel
        - Kandidat Portal
        - Public Page
        - Backend/API
        - AI Features
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other solutions you've thought about?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other info, screenshots, or examples?
