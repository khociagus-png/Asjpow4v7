name: ci-check

# Jaga kualitas repo tetap hijau di SEMUA jalur commit (desktop, HP, GitHub
# web, lokal): format prettier, lint, unit test, dan build. Menangkap apa pun
# yang lolos dari git hook lokal (mis. commit via GitHub web / device tanpa
# runtime).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Format check (prettier)
        run: bun run format:check

      - name: Lint (ESLint)
        run: bun run lint

      - name: Unit test (Vitest)
        run: bun run test

      - name: Build lengkap
        run: bun run build
