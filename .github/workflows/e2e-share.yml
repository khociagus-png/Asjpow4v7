name: e2e-share

# Endpoint /api/share-data (share.html?job=KODE) harus selalu hidup di produksi —
# kalau fungsi Netlify tidak ikut ter-deploy, halaman viewer jadi "Akses Ditolak".
# Workflow ini membuka share.html?job=<loker aktif> dan memastikan kandidat muncul.
# BASE_URL/SHARE_JOB bisa diubah per environment (lihat e2e/share-view.mjs).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  share-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (termasuk playwright)
        run: |
          npm i playwright
          npx playwright install chromium --with-deps

      - name: E2E share.html vs produksi
        run: node e2e/share-view.mjs
        env:
          BASE_URL: https://asjportal.netlify.app
          SHARE_JOB: TG633ASJ
