[build]
publish = "."
functions = "netlify/functions"
command = "echo 'Static site - no build step'"

[dev]
functions = "netlify/functions"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200
force = false

# --- Cache policy PWA: SELALU versi terbaru ---
# sw.js & HTML: no-cache (revalidasi tiap load) supaya update service worker
# dan bundel baru langsung terdeteksi browser — versi lama tidak menempel.
# Aset ber-hash (/assets/app-<hash>.js): URL-nya unik per konten, jadi aman
# di-cache selamanya (update = URL baru, browser otomatis ambil yang baru).
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/assets/modals-shared.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/assets/app-*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
